name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/IQ-HARRY7/android_device_xiaomi_beryl'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'android-12'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/beryl'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (leave blank if none)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (leave blank if none)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'beryl'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_beryl'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL    : ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch : ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL : ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Path     : ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name     : ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name   : ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target    : ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the Environment
      run: |
        sudo apt-get update -y
        sudo apt-get upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          linux-modules-extra-$(uname -r) \
          gperf gcc-multilib gcc-12-multilib g++-multilib g++-12-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
          libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev \
          freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
          imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-12-dev libncurses6 python3 python-is-python3 \
          tar curl wget zip unzip

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
          -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        git config --global user.name  "TWRP Builder"
        git config --global user.email "twrp-builder@github.com"
        repo init --depth=1 \
          -u "${{ github.event.inputs.MANIFEST_URL }}" \
          -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

    - name: Repo Sync
      working-directory: workspace
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle \
          --no-tags --optimized-fetch

    - name: Clone Device Tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.DEVICE_PATH }}"

    - name: Clone Common Tree
      if: |
        github.event.inputs.COMMON_TREE_URL != '' &&
        github.event.inputs.COMMON_PATH != ''
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.COMMON_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.COMMON_PATH }}"

    # FIX #5 — Removed broken scripts/convert.sh reference.
    # twrp.dependencies is handled natively by repo if local_manifests are set up.
    # We use a direct repo sync instead.
    - name: Sync Device Dependencies
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true
      run: |
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies" ]; then
          echo "Found twrp.dependencies — syncing additional repos..."
          repo sync -j$(nproc --all) --force-sync
        else
          echo "No twrp.dependencies file — skipping."
        fi

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Patch board_config check
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        sed -i \
          's/$(error Should not set BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/$(warning Suppressed BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/' \
          build/make/core/board_config.mk
        echo "Patch applied."

    - name: Download Prebuilt Kernel and DTB
      run: |
        PREBUILT_DIR="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}/prebuilt"
        mkdir -p "$PREBUILT_DIR"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/kernel" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/kernel"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/dtb.img" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/dtb.img"
        echo "Prebuilt files:"
        ls -lh "$PREBUILT_DIR"

    # FIX #1 — Was hardcoded 'make recoveryimage'. Now uses BUILD_TARGET input
    # so 'vendorboot' → 'make vendorbootimage', which is what beryl needs.
    - name: Build Recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    # FIX #2 — Removed the broken manual "Pack vendor_boot" step entirely.
    # It used lz4 -l (legacy, 8 MB cap = the exact truncation bug we fixed),
    # wrong header magic 'VNDR' (should be 'VNDRBOOT'), wrong struct layout,
    # and wrong ramdisk_addr 0x26f08000 (the old broken value).
    # The build system already produces a correct vendor_boot.img — let it.

    # FIX #3 + #4 — Fixed broken YAML (files: key was inside run: block)
    # and unified output: collect vendor_boot.img, not ramdisk-recovery.img.
    - name: Collect Output Files
      run: |
        OUT="${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        cp "$OUT/vendor_boot.img" "${GITHUB_WORKSPACE}/vendor_boot.img"
        echo "Output files:"
        ls -lh "${GITHUB_WORKSPACE}/vendor_boot.img"
        # Sanity check — catch wrong ramdisk_addr or truncation before release
        python3 - << 'PYEOF'
        import struct, sys
        data = open("vendor_boot.img", "rb").read()
        magic        = data[0:8]
        ramdisk_addr = struct.unpack_from("<I", data, 0x14)[0]
        ramdisk_size = struct.unpack_from("<I", data, 0x18)[0]
        print(f"Magic        : {magic}")
        print(f"ramdisk_addr : {hex(ramdisk_addr)}")
        print(f"ramdisk_size : {ramdisk_size / 1024 / 1024:.2f} MB")
        assert magic == b"VNDRBOOT",        f"FAIL: bad magic {magic}"
        assert ramdisk_addr == 0x44000000,  f"FAIL: wrong ramdisk_addr {hex(ramdisk_addr)}"
        assert ramdisk_size > 10_000_000,   f"FAIL: ramdisk suspiciously small — likely truncated ({ramdisk_size} bytes)"
        print("All sanity checks PASSED ✓")
        PYEOF

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: vendor_boot.img
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: twrp-${{ github.run_id }}
        body: |
          TWRP vendor_boot for ${{ github.event.inputs.DEVICE_NAME }}
          Manifest : ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device   : ${{ github.event.inputs.DEVICE_NAME }}
          Flash    : fastboot flash vendor_boot vendor_boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
