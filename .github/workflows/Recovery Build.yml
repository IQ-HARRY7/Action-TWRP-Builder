name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/IQ-HARRY7/android_device_xiaomi_beryl'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'beryl-user-12-SP1A.210812.016-OS2.0.3.0.VOQINXM-release-keys'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/beryl'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (leave blank if none)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (leave blank if none)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'beryl'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_beryl'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL    : ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch : ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL : ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Path     : ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name     : ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name   : ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target    : vendor_boot.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the Environment
      run: |
        sudo apt-get update -y
        sudo apt-get upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          linux-modules-extra-$(uname -r) \
          gperf gcc-multilib gcc-12-multilib g++-multilib g++-12-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
          libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev \
          freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
          imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-12-dev libncurses6 python3 python-is-python3 \
          tar curl wget zip unzip

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
          -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        git config --global user.name  "TWRP Builder"
        git config --global user.email "twrp-builder@github.com"
        repo init --depth=1 \
          -u "${{ github.event.inputs.MANIFEST_URL }}" \
          -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

    - name: Repo Sync
      working-directory: workspace
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle \
          --no-tags --optimized-fetch

    - name: Clone Device Tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.DEVICE_PATH }}"

    - name: Clone Common Tree
      if: |
        github.event.inputs.COMMON_TREE_URL != '' &&
        github.event.inputs.COMMON_PATH != ''
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.COMMON_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.COMMON_PATH }}"

    - name: Sync Device Dependencies
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true
      run: |
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies" ]; then
          bash "${GITHUB_WORKSPACE}/scripts/convert.sh" \
            "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies"
          repo sync -j$(nproc --all) --force-sync
        else
          echo "No dependencies file - skipping."
        fi

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Patch board_config check
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        sed -i 's/$(error Should not set BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/$(warning Suppressed BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/' build/make/core/board_config.mk
        echo "Patch applied successfully"

    - name: Download Prebuilt Kernel and DTB
      run: |
        PREBUILT_DIR="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}/prebuilt"
        mkdir -p "$PREBUILT_DIR"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/kernel" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/kernel"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/dtb.img" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/dtb.img"
        ls -lh "$PREBUILT_DIR"

    - name: Building recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make clean
        make recoveryimage -j$(nproc --all)

    - name: Pack vendor_boot
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        OUT="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        PREBUILT="${{ github.event.inputs.DEVICE_PATH }}/prebuilt"
        WORKSPACE="${GITHUB_WORKSPACE}"
        echo "=== Creating ramdisk from recovery/root ==="
        cd "$OUT/recovery/root"
        find . | cpio -H newc -o 2>/dev/null | lz4 -l > "${WORKSPACE}/ramdisk-recovery.img"
        cd ${{ steps.pwd.outputs.workspace-folder }}
        echo "Ramdisk size: $(ls -lh ${WORKSPACE}/ramdisk-recovery.img)"
        echo "=== Packing vendor_boot with Python ==="
        python3 << 'PYEOF'
        import struct, os, sys

        WORKSPACE = os.environ.get('GITHUB_WORKSPACE', '')
        ramdisk_path = f"{WORKSPACE}/ramdisk-recovery.img"
        dtb_path     = "device/xiaomi/beryl/prebuilt/dtb.img"
        output_path  = f"{WORKSPACE}/vendor_boot.img"

        ramdisk = open(ramdisk_path, 'rb').read()
        dtb     = open(dtb_path,     'rb').read()

        PAGE = 4096

        def pad(data):
            r = len(data) % PAGE
            return data + b'\x00' * (PAGE - r) if r else data

        # Vendor boot v4 header (fixed size = 4 pages = 16384 bytes)
        VENDOR_RAMDISK_TYPE_PLATFORM = 1
        cmdline = b'bootopt=64S3,32N2,64N2'

        header = struct.pack(
            '<4sIIII2048sIIIIIII2048s',
            b'VNDR',                  # magic
            4,                        # header_version
            PAGE,                     # page_size
            0x26f08000,               # kernel_load_addr (unused v4)
            0x07c88000,               # ramdisk_load_addr (unused v4)
            cmdline + b'\x00' * (2048 - len(cmdline)),  # cmdline
            len(ramdisk),             # vendor_ramdisk_size
            len(dtb),                 # dtb_size
            0,                        # dtb_load_addr
            0,                        # vendor_ramdisk_table_size
            0,                        # vendor_ramdisk_table_entry_num
            0,                        # vendor_ramdisk_table_entry_size
            0,                        # bootconfig_size
            b'\x00' * 2048            # name
        )

        with open(output_path, 'wb') as f:
            f.write(pad(header))
            f.write(pad(ramdisk))
            f.write(pad(dtb))

        size = os.path.getsize(output_path)
        print(f"vendor_boot.img created! Size: {size/1024/1024:.2f} MB")
        PYEOF
        ls -lh "${GITHUB_WORKSPACE}/vendor_boot.img"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: vendor_boot.img
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: twrp-${{ github.run_id }}
        body: |
          TWRP for ${{ github.event.inputs.DEVICE_NAME }}
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Build target: vendor_boot.img
          Flash: fastboot flash vendor_boot vendor_boot.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
