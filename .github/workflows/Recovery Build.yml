name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/IQ-HARRY7/android_device_xiaomi_beryl'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'beryl-user-12-SP1A.210812.016-OS2.0.3.0.VOQINXM-release-keys'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/beryl'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (leave blank if none)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (leave blank if none)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'beryl'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'omni_beryl'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::Build Parameters"
        echo "Manifest URL    : ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch : ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL : ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Path     : ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name     : ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name   : ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target    : vendor_boot.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare the Environment
      run: |
        sudo apt-get update -y
        sudo apt-get upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
          linux-modules-extra-$(uname -r) \
          gperf gcc-multilib gcc-12-multilib g++-multilib g++-12-multilib \
          libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
          lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache \
          lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev \
          libsdl1.2-dev build-essential libgtk-3-dev libglu1-mesa-dev \
          freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
          imagemagick libbz2-dev lzma ncftp qemu-user-static \
          libstdc++-12-dev libncurses6 python3 python-is-python3 \
          tar curl wget zip unzip

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
          -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize repo
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
        git config --global user.name  "TWRP Builder"
        git config --global user.email "twrp-builder@github.com"
        repo init --depth=1 \
          -u "${{ github.event.inputs.MANIFEST_URL }}" \
          -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

    - name: Repo Sync
      working-directory: workspace
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle \
          --no-tags --optimized-fetch

    - name: Clone Device Tree
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.DEVICE_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.DEVICE_PATH }}"

    - name: Clone Common Tree
      if: |
        github.event.inputs.COMMON_TREE_URL != '' &&
        github.event.inputs.COMMON_PATH != ''
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        git clone "${{ github.event.inputs.COMMON_TREE_URL }}" \
          -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
          "./${{ github.event.inputs.COMMON_PATH }}"

    - name: Sync Device Dependencies
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true
      run: |
        if [ -f "${{ github.event.inputs.DEVICE_PATH }}/twrp.dependencies" ]; then
          echo "Found twrp.dependencies - syncing..."
          repo sync -j$(nproc --all) --force-sync
        else
          echo "No twrp.dependencies - skipping."
        fi

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Patch board_config check
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        # BUILDING_VENDOR_BOOT_IMAGE is readonly in build system
        # Cannot set from BoardConfig.mk (line 901 error)
        # Fix: remove readonly declaration + remove the error guard

        # Remove readonly declaration if present
        sed -i '/^\.KATI_READONLY\s*:=\s*BUILDING_VENDOR_BOOT_IMAGE/d' \
          build/make/core/board_config.mk 2>/dev/null || true

        # Remove the error for BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT
        sed -i '/Should not set BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT/d' \
          build/make/core/board_config.mk

        # Verify
        if grep -q 'Should not set BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT' \
            build/make/core/board_config.mk; then
          echo "FATAL: error line still present"
          exit 1
        fi
        echo "Patch verified OK"
        
        echo "=== Checking board_config.mk around BUILDING_VENDOR_BOOT_IMAGE ==="
        grep -n "BUILDING_VENDOR_BOOT_IMAGE\|BOARD_MOVE_RECOVERY" \
          build/make/core/board_config.mk | head -20

    - name: Download Prebuilt Kernel and DTB
      run: |
        PREBUILT_DIR="${{ steps.pwd.outputs.workspace-folder }}/${{ github.event.inputs.DEVICE_PATH }}/prebuilt"
        mkdir -p "$PREBUILT_DIR"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/kernel" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/kernel"
        wget -q --show-progress \
          -O "$PREBUILT_DIR/dtb.img" \
          "https://github.com/IQ-HARRY7/android_device_xiaomi_beryl/releases/download/Kernal/dtb.img"
        ls -lh "$PREBUILT_DIR"

    - name: Build Recovery
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
        make recoveryimage -j$(nproc --all)

        
    - name: Extract recovery.cpio from vendor_boot.img
      run: |
        OUT="${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        
        # 1. Locate vendor_boot.img
        VENDOR_BOOT=$(find "$OUT" -name "vendor_boot.img" | head -1)
        if [ -z "$VENDOR_BOOT" ]; then echo "ERROR: vendor_boot.img not found"; exit 1; fi
        echo "Found: $VENDOR_BOOT"

        # 2. Locate unpack_bootimg.py (AOSP standard tool)
        UNPACK_SCRIPT=$(find "${{ steps.pwd.outputs.workspace-folder }}" -name "unpack_bootimg.py" -type f | head -1)
        if [ -z "$UNPACK_SCRIPT" ]; then echo "ERROR: unpack_bootimg.py not found"; exit 1; fi
        echo "Using unpack script: $UNPACK_SCRIPT"

        # 3. Unpack vendor_boot.img
        UNPACK_DIR="${GITHUB_WORKSPACE}/unpacked"
        mkdir -p "$UNPACK_DIR"
        python3 "$UNPACK_SCRIPT" --boot_img "$VENDOR_BOOT" --out "$UNPACK_DIR"

        # 4. Find the compressed ramdisk inside
        RAMDISK_FILE=$(find "$UNPACK_DIR" -name "ramdisk*" | head -1)
        if [ -z "$RAMDISK_FILE" ]; then echo "ERROR: ramdisk not found in unpacked vendor_boot"; exit 1; fi
        echo "Found compressed ramdisk: $RAMDISK_FILE"

        # 5. Decompress to raw recovery.cpio (TWRP uses LZ4 frame format)
        if [[ "$RAMDISK_FILE" == *.lz4 ]]; then
          lz4 -d "$RAMDISK_FILE" "${GITHUB_WORKSPACE}/recovery.cpio"
        elif [[ "$RAMDISK_FILE" == *.gz ]]; then
          gunzip -c "$RAMDISK_FILE" > "${GITHUB_WORKSPACE}/recovery.cpio"
        else
          # Fallback: assume raw cpio
          cp "$RAMDISK_FILE" "${GITHUB_WORKSPACE}/recovery.cpio"
        fi

        echo "✅ Successfully created recovery.cpio"
        ls -lh "${GITHUB_WORKSPACE}/recovery.cpio"
        echo "Final size: $(du -h "${GITHUB_WORKSPACE}/recovery.cpio" | cut -f1)"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          vendor_boot.img
          recovery.cpio
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: twrp-${{ github.run_id }}
        body: |
          TWRP vendor_boot for ${{ github.event.inputs.DEVICE_NAME }}
          Manifest : ${{ github.event.inputs.MANIFEST_BRANCH }}
          Flash    : fastboot flash vendor_boot vendor_boot.img
          Extract  : recovery.cpio (Raw ramdisk for debugging/modding)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
